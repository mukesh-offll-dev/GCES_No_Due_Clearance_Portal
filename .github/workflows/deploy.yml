name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test and Deploy
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        env:
          SECRET_KEY: 'ci-test-secret-key-for-django-portal'
          DEBUG: 'True'
          MONGO_URI: 'mongodb://localhost:27017'
        run: |
          python manage.py test authentication

      - name: Trigger Deployment Webhook
        env:
          SECRET_VARIABLE: ${{ secrets.SECRET_VARIABLE || secrets.DEPLOY_WEBHOOK_TOKEN || secrets.DEPLOY_TOKEN }}
        run: |
          echo "Triggering deployment webhook..."
          curl -f -sS "https://fedora.tail9454e5.ts.net/deploy_nodue_portal.sh?token=${SECRET_VARIABLE}&async=true"
          echo "Deployment webhook triggered successfully!"
