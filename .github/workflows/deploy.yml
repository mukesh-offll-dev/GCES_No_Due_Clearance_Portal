name: Deploy to Render

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test and Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        env:
          SECRET_KEY: 'ci-test-secret-key-for-django-portal'
          DEBUG: 'True'
          MONGO_URI: 'mongodb://localhost:27017'
        run: |
          python manage.py test authentication

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL || 'https://api.render.com/deploy/srv-d58kvsqli9vc73a4srjg?key=Woe2b2lkmC4' }}
        run: |
          echo "Triggering Render deployment..."
          curl -f -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deployment triggered successfully!"
